sonar.projectKey=ukinory
sonar.projectName=Ukinory
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=backend,frontend/src

sonar.test.inclusions=**/tests/**/*.py,**/test_*.py,**/*_tests.py,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.exclusions=**/migrations/**,**/__pycache__/**,**/.venv/**,**/tests/**,**/test_*.py,**/*_tests.py,**/notebooks/**,**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info