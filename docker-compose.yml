services:

  db:
    image: pgvector/pgvector:pg17
    container_name: postgres_db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  cron:
    build:
      context: ./backend
    container_name: django_cron

    entrypoint: []

    command: sh -c "python manage.py crontab add && cron -f"

    volumes:
      - ./backend:/app

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}

      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      EMBEDDING_MIN_REQUEST_INTERVAL_SECONDS: ${EMBEDDING_MIN_REQUEST_INTERVAL_SECONDS}
      EMBEDDING_USE_SHARED_PACING: ${EMBEDDING_USE_SHARED_PACING}

      RECOMMENDATION_PROPAGATION_K: ${RECOMMENDATION_PROPAGATION_K}
      RECOMMENDATION_MIN_RATERS_FOR_CF: ${RECOMMENDATION_MIN_RATERS_FOR_CF}
      RECOMMENDATION_MIN_COMMON_MOVIES: ${RECOMMENDATION_MIN_COMMON_MOVIES}
      RECOMMENDATION_MAX_SIMILAR_USERS: ${RECOMMENDATION_MAX_SIMILAR_USERS}
      RECOMMENDATION_DEFAULT_POOL_SIZE: ${RECOMMENDATION_DEFAULT_POOL_SIZE}
      RECOMMENDATION_DEFAULT_STRATEGY: ${RECOMMENDATION_DEFAULT_STRATEGY}
      RECOMMENDATION_DEFAULT_ALPHA: ${RECOMMENDATION_DEFAULT_ALPHA}
      RECOMMENDATION_RATING_SCALE_MAX: ${RECOMMENDATION_RATING_SCALE_MAX}
      RECOMMENDATION_JUSTIFICATION_MODEL: ${RECOMMENDATION_JUSTIFICATION_MODEL}
      RECOMMENDATION_JUSTIFICATION_FALLBACK_MODEL: ${RECOMMENDATION_JUSTIFICATION_FALLBACK_MODEL}
      RECOMMENDATION_MAX_HISTORY_MOVIES: ${RECOMMENDATION_MAX_HISTORY_MOVIES}

      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_MIN_REQUEST_INTERVAL_SECONDS: ${TMDB_MIN_REQUEST_INTERVAL_SECONDS}
      TMDB_USE_SHARED_PACING: ${TMDB_USE_SHARED_PACING}
      TMDB_DISCOVER_MAX_PAGES: ${TMDB_DISCOVER_MAX_PAGES}
      TMDB_DISCOVER_MIN_VOTE_COUNT: ${TMDB_DISCOVER_MIN_VOTE_COUNT}
      TMDB_DISCOVER_NEW_RELEASE_WINDOW_DAYS: ${TMDB_DISCOVER_NEW_RELEASE_WINDOW_DAYS}
      TMDB_DISCOVER_NEW_RELEASE_MIN_VOTE_COUNT: ${TMDB_DISCOVER_NEW_RELEASE_MIN_VOTE_COUNT}
      TMDB_DISCOVER_START_YEAR: ${TMDB_DISCOVER_START_YEAR}
      TMDB_DISCOVER_PAGES_PER_BUCKET: ${TMDB_DISCOVER_PAGES_PER_BUCKET}
      TMDB_DISCOVER_DECADE_MIN_VOTE_COUNT: ${TMDB_DISCOVER_DECADE_MIN_VOTE_COUNT}
      TMDB_DISCOVER_GENRE_MIN_VOTE_COUNT: ${TMDB_DISCOVER_GENRE_MIN_VOTE_COUNT}

      WIKIDATA_MIN_REQUEST_INTERVAL_SECONDS: ${WIKIDATA_MIN_REQUEST_INTERVAL_SECONDS}
      WIKIDATA_USE_SHARED_PACING: ${WIKIDATA_USE_SHARED_PACING}
      WIKIDATA_USER_AGENT: ${WIKIDATA_USER_AGENT}

      REDIS_URL: ${REDIS_URL}

      DEBUG: "1"
      PYTHONPATH: /app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  backend:
    build:
      context: ./backend

    container_name: django_backend

    command: python -m debugpy --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8000

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"
      - "5678:5678"
      - "8888:8888"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}

      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      EMBEDDING_MIN_REQUEST_INTERVAL_SECONDS: ${EMBEDDING_MIN_REQUEST_INTERVAL_SECONDS}
      EMBEDDING_USE_SHARED_PACING: ${EMBEDDING_USE_SHARED_PACING}

      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_MIN_REQUEST_INTERVAL_SECONDS: ${TMDB_MIN_REQUEST_INTERVAL_SECONDS}
      TMDB_USE_SHARED_PACING: ${TMDB_USE_SHARED_PACING}
      TMDB_DISCOVER_MAX_PAGES: ${TMDB_DISCOVER_MAX_PAGES}
      TMDB_DISCOVER_MIN_VOTE_COUNT: ${TMDB_DISCOVER_MIN_VOTE_COUNT}
      TMDB_DISCOVER_NEW_RELEASE_WINDOW_DAYS: ${TMDB_DISCOVER_NEW_RELEASE_WINDOW_DAYS}
      TMDB_DISCOVER_NEW_RELEASE_MIN_VOTE_COUNT: ${TMDB_DISCOVER_NEW_RELEASE_MIN_VOTE_COUNT}
      TMDB_DISCOVER_START_YEAR: ${TMDB_DISCOVER_START_YEAR}
      TMDB_DISCOVER_PAGES_PER_BUCKET: ${TMDB_DISCOVER_PAGES_PER_BUCKET}
      TMDB_DISCOVER_DECADE_MIN_VOTE_COUNT: ${TMDB_DISCOVER_DECADE_MIN_VOTE_COUNT}
      TMDB_DISCOVER_GENRE_MIN_VOTE_COUNT: ${TMDB_DISCOVER_GENRE_MIN_VOTE_COUNT}

      WIKIDATA_MIN_REQUEST_INTERVAL_SECONDS: ${WIKIDATA_MIN_REQUEST_INTERVAL_SECONDS}
      WIKIDATA_USE_SHARED_PACING: ${WIKIDATA_USE_SHARED_PACING}
      WIKIDATA_USER_AGENT: ${WIKIDATA_USER_AGENT}

      REDIS_URL: ${REDIS_URL}

      DEBUG: "1"
      PYTHONPATH: /app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 10s
      timeout: 5s
      retries: 5


  frontend:
    build:
      context: ./frontend

    container_name: react_frontend

    command: npm run dev -- --host 0.0.0.0

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    depends_on:
      backend:
        condition: service_healthy


volumes:
  postgres_data: