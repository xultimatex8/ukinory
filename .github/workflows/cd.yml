name: CD

on:
  release:
    types:
      - published

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/1
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      WIKIDATA_USER_AGENT: ${{ secrets.WIKIDATA_USER_AGENT }}

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django system checks
        working-directory: backend
        run: python manage.py check

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  docker:
    name: Validate Docker
    needs: validate
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      WIKIDATA_USER_AGENT: ${{ secrets.WIKIDATA_USER_AGENT }}

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Create CI environment
        run: |
          cat > .env.ci <<'EOF'
          POSTGRES_DB=test_db
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_password
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          TMDB_API_KEY=${TMDB_API_KEY}
          WIKIDATA_USER_AGENT=${WIKIDATA_USER_AGENT}
          EOF

      - name: Validate Compose configuration
        run: docker compose --env-file .env.ci config

      - name: Build images
        run: docker compose --env-file .env.ci build --pull

      - name: Start services
        run: docker compose --env-file .env.ci up -d

      - name: Wait for backend
        run: |
          timeout 60 bash -c '
            until curl --fail --silent http://localhost:8000/health/ > /dev/null; do
              sleep 2
            done
          '

      - name: Show container status
        run: docker compose --env-file .env.ci ps

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env.ci logs --timestamps

      - name: Stop services
        if: always()
        run: docker compose --env-file .env.ci down -v


  deploy-render:
    name: Deploy Backend to Render
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        run: curl --fail --request POST "${{ secrets.RENDER_DEPLOY_HOOK }}"


  deploy-vercel:
    name: Deploy Frontend to Vercel
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Deploy to Vercel
        working-directory: frontend
        run: vercel --prod --token="${{ secrets.VERCEL_TOKEN }}" --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
