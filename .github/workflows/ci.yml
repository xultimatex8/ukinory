name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django system checks
        working-directory: backend
        run: python manage.py check

      - name: Run tests
        working-directory: backend
        run: pytest


  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build
        working-directory: frontend
        run: npm run build


  docker:
    name: Docker Compose
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cat > .env.ci <<'EOF'
          POSTGRES_DB=test_db
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_password
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
          EOF

      - name: Validate Compose configuration
        run: docker compose --env-file .env.ci config

      - name: Build images
        run: docker compose --env-file .env.ci build --pull

      - name: Start services
        run: docker compose --env-file .env.ci up -d

      - name: Wait for backend
        run: |
          timeout 60 bash -c '
            until curl --fail --silent http://localhost:8000/health/ > /dev/null; do
              sleep 2
            done
          '

      - name: Show container status
        run: docker compose --env-file .env.ci ps

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env.ci logs --timestamps

      - name: Stop services
        if: always()
        run: docker compose --env-file .env.ci down -v
